[project]
name = "molchat"
version = "0.1.0"
description = "RAG + function-calling agent over molecular representations (Moleco extension)"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "rdkit>=2024.3",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["molchat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
